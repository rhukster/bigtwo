<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- SEO Meta Tags -->

		<meta name="author" content="bigtwo.dev" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://bigtwo.dev/" />
		<meta property="og:title" content="Big Two - Free Online Multiplayer Card Game" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:url" content="https://bigtwo.dev/" />
		<meta name="twitter:title" content="Big Two - Free Online Multiplayer Card Game" />
		<meta name="twitter:description" content="Play Big Two (Dai Di, Pusoy Dos) online with friends! A classic Asian climbing card game where you race to empty your hand first." />
		<meta name="twitter:image" content="https://bigtwo.dev/og-image.png" />

		<meta name="robots" content="index, follow" />
		<meta name="theme-color" content="#d4af37" />
		<link rel="canonical" href="https://bigtwo.dev/" />

		<!-- Favicon -->
		<link rel="icon" href="/favicon.ico" />

		<!-- Structured Data -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "WebApplication",
			"name": "Big Two",
			"alternateName": ["Dai Di", "Pusoy Dos", "Chinese Poker"],
			"description": "Play Big Two online with friends! A classic Asian climbing card game where you race to empty your hand first by playing increasingly powerful card combinations.",
			"url": "https://bigtwo.dev",
			"applicationCategory": "GameApplication",
			"operatingSystem": "Any",
			"offers": {
				"@type": "Offer",
				"price": "0",
				"priceCurrency": "USD"
			},
			"aggregateRating": {
				"@type": "AggregateRating",
				"ratingValue": "4.8",
				"ratingCount": "100"
			}
		}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
